<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Verification | FraudGuard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        .challenge-card {
            max-width: 550px;
            padding: 50px 40px;
        }

        .alert-box {
            font-size: 4.5rem;
            color: var(--danger);
            margin-bottom: 25px;
            filter: drop-shadow(0 0 20px rgba(244, 63, 94, 0.4));
            animation: pulse-danger 1.5s infinite ease-in-out;
        }

        @keyframes pulse-danger {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        .question-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            padding: 25px;
            border-radius: 20px;
            margin: 30px 0;
            text-align: left;
            position: relative;
        }

        .question-panel::before {
            content: 'SECURITY CHALLENGE';
            position: absolute;
            top: -10px;
            left: 20px;
            background: var(--bg-deep);
            color: var(--primary);
            font-size: 0.65rem;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 4px;
            letter-spacing: 0.1em;
        }

        .question-text {
            color: white;
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.5;
        }

        .btn-emergency {
            background: linear-gradient(135deg, var(--danger) 0%, #991b1b 100%);
            box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.4);
        }

        .error-message {
            background: rgba(244, 63, 94, 0.1);
            color: #fb7185;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            border: 1px solid rgba(244, 63, 94, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
        }
    </style>
</head>

<body class="auth-body">
    <div class="container" style="max-width: 550px;">
        <div class="card challenge-card" style="text-align: center;">
            <div class="alert-box">
                <i class="fas fa-biohazard"></i>
            </div>
            
            <h2 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 10px;">Emergency Override</h2>
            <p style="color: #94a3b8; font-size: 0.95rem; line-height: 1.6;">
                Verification node unresponsive. Manual identity substantiation required via cryptographic challenge.
            </p>

            <div class="question-panel">
                <p class="question-text">{{ question }}</p>
            </div>

            {% if error %}
            <div class="error-message">
                <i class="fas fa-exclamation-triangle"></i> {{ error }}
            </div>
            {% endif %}

            <form method="POST">
                <div class="input-group">
                    <input type="text" name="security_answer" placeholder="Enter your secret response..."
                        required autocomplete="off" style="height: 60px; font-size: 1.1rem; text-align: center;">
                </div>
                
                <button type="submit" class="btn-premium btn-emergency" style="height: 70px; margin-top: 10px;">
                    EXECUTE IDENTITY BYPASS <i class="fas fa-fingerprint" style="margin-left: 12px; font-size: 1rem;"></i>
                </button>
            </form>

            <div style="margin-top: 35px; display: flex; flex-direction: column; gap: 15px;">
                {% if current_user.age and current_user.age >= 60 %}
                <a href="{{ url_for('emergency_options', txn_id=txn_id) }}" style="color: var(--primary); text-decoration: none; font-weight: 700; font-size: 0.85rem; letter-spacing: 0.05em;">
                    <i class="fas fa-sync-alt" style="margin-right: 8px;"></i> ATTEMPT DUAL-NODE SYNC
                </a>
                {% endif %}

                <a href="/transaction" style="color: #64748b; text-decoration: none; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.05em;">
                    <i class="fas fa-times" style="margin-right: 8px;"></i> ABORT MISSION
                </a>
            </div>
        </div>
    </div>
</body>

</html>
